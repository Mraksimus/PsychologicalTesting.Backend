ktor {

  deployment {
    port = 1488
  }

  application {
    modules = [ ru.psychologicalTesting.main.AppKt.module ]
  }

}

authentication {
  issuer = "http://localhost:1488"
  audience = "http://localhost:1488"
  tokenTtl = 24h

  publicKeyPath = "keys/jwt-public"
  privateKeyPath = "keys/jwt-private"

  emailRegex = "[^@ \\t\\r\\n]+@[^@ \t\r\n]+\\.[^@ \\t\\r\\n]+"
  passwordRegex = ".{6,72}"
}

database {
  driver = "postgresql"
  host = "localhost"
  port = 4343
  username = "postgres"
  database = "postgres"
  password = "postgres"
}

llm {
  host = "localhost"
  port = 1489
}

cors {
  # Defaults to false
  #allowAnyHost = true
  allowedHosts = [
    {host = "localhost:1488", schemes = ["http"]}
  ]

  # Defaults to true
  #allowAnyMethod = true
  #allowedMethods = [GET, POST, PATCH, PUT, DELETE, OPTIONS]

  allowAnyHeader = true
  #allowedHeaders = []

  # Defaults to true
  #allowCredentials = true

  # Defaults to true
  #allowNonSimpleContentTypes = true
}
