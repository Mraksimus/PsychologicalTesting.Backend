ktor {

  deployment {
    port = 1488
  }

  application {
    modules = [ ru.psychologicalTesting.main.AppKt.module ]
  }

}

authentication {
  issuer = "http://localhost:1488"
  audience = "http://localhost:1488"
  tokenTtl = 24h

  publicKeyPath = "keys/jwt-public"
  privateKeyPath = "keys/jwt-private"

  emailRegex = "[^@ \\t\\r\\n]+@[^@ \t\r\n]+\\.[^@ \\t\\r\\n]+"
  passwordRegex = ".{6,72}"
}

database {
  driver = "postgresql"
  host = "localhost"
  port = 4343
  username = "postgres"
  database = "postgres"
  password = "postgres"
}

llm {
  host = "localhost"
  port = 1489
}

crypto {
  # 32 bytes, base64. Provide via CRYPTO_KEY env in production.
  key = ""
  key = ${?CRYPTO_KEY}
}

email {
  enabled = false
  enabled = ${?EMAIL_ENABLED}

  host = ""
  host = ${?EMAIL_HOST}

  port = 587
  port = ${?EMAIL_PORT}

  username = ""
  username = ${?EMAIL_USERNAME}

  password = ""
  password = ${?EMAIL_PASSWORD}

  useStartTLS = true
  useStartTLS = ${?EMAIL_USE_STARTTLS}

  fromAddress = ""
  fromAddress = ${?EMAIL_FROM_ADDRESS}

  fromName = "MindCheck"
  fromName = ${?EMAIL_FROM_NAME}

  verificationBaseUrl = "http://localhost:5173/verify-email"
  verificationBaseUrl = ${?EMAIL_VERIFICATION_BASE_URL}

  tokenTtlHours = 24
  tokenTtlHours = ${?EMAIL_TOKEN_TTL_HOURS}
}

cors {
  # Defaults to false
  #allowAnyHost = true
  allowedHosts = [
    {host = "localhost:1488", schemes = ["http"]}
  ]

  # Defaults to true
  #allowAnyMethod = true
  #allowedMethods = [GET, POST, PATCH, PUT, DELETE, OPTIONS]

  allowAnyHeader = true
  #allowedHeaders = []

  # Defaults to true
  #allowCredentials = true

  # Defaults to true
  #allowNonSimpleContentTypes = true
}
